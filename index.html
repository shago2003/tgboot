<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #f2f2f7; --card: #ffffff; --text: #000000; --blue: #007aff; --red: #ff3b30; --gray: #8e8e93; }
        [data-theme="dark"] { --bg: #000000; --card: #1c1c1e; --text: #ffffff; }
        
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 16px; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; transition: background 0.3s; }
        
        /* === КРАСИВАЯ ЗАСТАВКА (PRELOADER) === */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center;
            transition: opacity 0.8s ease-out; /* Плавное исчезновение */
        }
        
        /* Анимация иконки */
        .loader-icon {
            font-size: 80px; margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Анимация текста */
        .loader-title {
            font-size: 28px; font-weight: 800; color: var(--blue);
            opacity: 0; animation: fadeInUp 0.8s forwards 0.2s;
        }
        .loader-sub {
            font-size: 15px; color: var(--gray); margin-top: 10px; margin-bottom: 40px;
            opacity: 0; animation: fadeInUp 0.8s forwards 0.5s;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Крутящийся спиннер */
        .spinner {
            width: 30px; height: 30px;
            border: 4px solid rgba(0, 122, 255, 0.1);
            border-left-color: var(--blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0; animation: spin 1s linear infinite, fadeIn 1s forwards 0.8s;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { to { opacity: 1; } }
        /* ========================================= */

        /* Остальные стили (как было) */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .app-title { font-size: 22px; font-weight: 800; }
        .theme-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.2s; }
        .theme-btn:active { transform: scale(0.9); }

        .balance-card { background: linear-gradient(135deg, #007aff, #0056b3); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }
        .balance-amount { font-size: 36px; font-weight: 800; margin-top: 5px; }

        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .card:active { transform: scale(0.98); }
        .card-col { display: block; width: 100%; }
        
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--bg); color: var(--text); font-size: 16px; outline: none; margin-top: 5px; box-sizing: border-box; }
        label { font-size: 12px; color: var(--gray); margin-left: 4px; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
        .btn-inc { background: var(--blue); }
        .btn-exp { background: var(--red); }
        
        .setting-row { display: flex; align-items: center; width: 100%; }
        .setting-icon { font-size: 22px; margin-right: 15px; }
        .setting-text { font-size: 16px; font-weight: 500; flex-grow: 1; }
        .setting-status { font-size: 14px; color: var(--gray); }

        .history-header { font-size: 18px; font-weight: 700; margin-bottom: 10px; margin-left: 5px; margin-top: 20px;}
        .history-item { background: var(--card); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .h-left { display: flex; flex-direction: column; }
        .del-btn { background: rgba(255, 59, 48, 0.1); color: var(--red); border: none; font-size: 18px; cursor: pointer; padding: 8px; border-radius: 8px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 0.5px solid var(--gray); display: flex; justify-content: space-around; padding: 10px 0 25px; z-index: 100; }
        .tab-item { color: var(--gray); text-align: center; font-size: 10px; cursor: pointer; }
        .tab-item.active { color: var(--blue); }
        .tab-icon { font-size: 24px; display: block; margin-bottom: 2px; }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fade 0.2s; }
        @keyframes fade { from{opacity:0} to{opacity:1} }
        #toast { position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; transition: 0.3s; z-index: 200; }
        #toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-icon">💰</div>
        <div class="loader-title">Мой Кошелек</div>
        <div class="loader-sub">Загрузка данных...</div>
        <div class="spinner"></div>
    </div>

    <div id="toast">✅ Готово</div>

    <div class="app-header">
        <div class="app-title">Финансы</div>
        <div class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</div>
    </div>

    <div class="balance-card">
        <div style="font-size: 13px; opacity: 0.8">Текущий баланс</div>
        <div class="balance-amount" id="balance">...</div>
    </div>

    <div id="view-income" class="view-section active">
        <div class="card card-col">
            <label>Сумма</label><input type="number" id="inc_sum" placeholder="0.00" inputmode="decimal">
            <div style="height:10px"></div>
            <label>Откуда</label><input type="text" id="inc_from" placeholder="Банк">
            <div style="height:10px"></div>
            <label>Куда</label><input type="text" id="inc_to" placeholder="Касса">
        </div>
        <button class="btn btn-inc" onclick="send('income')">Добавить Приход</button>
    </div>

    <div id="view-expense" class="view-section">
        <div class="card card-col">
            <label>Сумма</label><input type="number" id="exp_sum" placeholder="0.00" inputmode="decimal">
            <div style="height:10px"></div>
            <label>Категория</label><input type="text" id="exp_cat" placeholder="Еда">
            <div style="height:10px"></div>
            <label>Комментарий</label><input type="text" id="exp_com" placeholder="Обед">
        </div>
        <button class="btn btn-exp" onclick="send('expense')">Списать Расход</button>
    </div>

    <div id="view-history" class="view-section">
        
        <div class="card" onclick="toggleAnim()">
            <div class="setting-row">
                <span class="setting-icon">✨</span>
                <span class="setting-text">Анимация при входе</span>
                <span class="setting-status" id="anim-status">Вкл</span>
            </div>
        </div>

        <div class="card" onclick="downloadExcel()">
            <div class="setting-row">
                <span class="setting-icon">📥</span>
                <span class="setting-text">Скачать отчет</span>
                <span class="setting-status">Excel</span>
            </div>
        </div>

        <div class="history-header">Последние операции</div>
        <div id="history-list">
            <div style="text-align:center; padding:20px; color:gray">Загрузка...</div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('view-income')"><span class="tab-icon">➕</span>Приход</div>
        <div class="tab-item" onclick="switchTab('view-expense')"><span class="tab-icon">➖</span>Расход</div>
        <div class="tab-item" onclick="switchTab('view-history')"><span class="tab-icon">⚙️</span>Меню</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        
        // !!! ВСТАВЬ СВОЮ ССЫЛКУ NGROK НИЖЕ !!!
        const SERVER_URL = "https://unsucceeded-idella-violative.ngrok-free.dev";
        const headers = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };

        // --- УЛУЧШЕННАЯ ЛОГИКА АНИМАЦИИ ---
        checkAnim();
        function checkAnim() {
            const isEnabled = localStorage.getItem('anim') !== 'off'; 
            const loader = document.getElementById('loader');
            
            document.getElementById('anim-status').innerText = isEnabled ? 'Вкл' : 'Выкл';

            if (isEnabled) {
                // Ждем 3 секунды (3000 миллисекунд)
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 800); // Ждем пока исчезнет
                }, 3000); // <--- ТУТ МЕНЯЕТСЯ ДЛИТЕЛЬНОСТЬ
            } else {
                loader.style.display = 'none';
            }
        }

        function toggleAnim() {
            const current = localStorage.getItem('anim') !== 'off';
            const next = !current;
            localStorage.setItem('anim', next ? 'on' : 'off');
            document.getElementById('anim-status').innerText = next ? 'Вкл' : 'Выкл';
            showToast(next ? 'Анимация включена' : 'Анимация выключена');
        }
        // -----------------------

        loadBalance();

        function loadBalance() {
            fetch(SERVER_URL + '/api/balance', {headers}).then(r=>r.json()).then(d=>{
                document.getElementById('balance').innerText = d.balance + ' ₼';
            }).catch(e => document.getElementById('balance').innerText = 'Нет связи');
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            try {
                const res = await fetch(SERVER_URL + '/api/history', {headers});
                const data = await res.json();
                list.innerHTML = '';
                if(!data.length) list.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.5">Пусто</div>';
                
                data.forEach(item => {
                    const isInc = item.debit > 0;
                    const color = isInc ? '#34c759' : '#ff3b30';
                    const sign = isInc ? '+' : '-';
                    const val = isInc ? item.debit : item.credit;
                    const desc = isInc ? item.transfer : `${item.category} (${item.comment})`;
                    list.innerHTML += `
                        <div class="history-item">
                            <div class="h-left">
                                <span style="font-weight:700; font-size:15px; color:${color}">${sign} ${val} ₼</span>
                                <span style="font-size:12px; opacity:0.7">${desc}</span>
                            </div>
                            <button class="del-btn" onclick="delItem(${item.id})">🗑</button>
                        </div>
                    `;
                });
            } catch(e) { list.innerHTML = 'Ошибка'; }
        }

        async function delItem(id) {
            if(!confirm("Удалить?")) return;
            try {
                const res = await fetch(SERVER_URL + '/api/delete', { method:'POST', headers, body:JSON.stringify({id}) });
                const ans = await res.json();
                if(ans.status === 'deleted') {
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    loadHistory();
                    showToast("Удалено");
                }
            } catch(e) { showToast("Ошибка"); }
        }

        async function send(type) {
            let data = {};
            if (type === 'income') {
                const val = document.getElementById('inc_sum').value;
                if (!val) return alert('Сумма?');
                data = { debit: val, transfer: document.getElementById('inc_from').value + '-' + document.getElementById('inc_to').value };
            } else {
                const val = document.getElementById('exp_sum').value;
                if (!val) return alert('Сумма?');
                data = { credit: val, category: document.getElementById('exp_cat').value, comment: document.getElementById('exp_com').value };
            }
            try {
                showToast('Сохранение...');
                const res = await fetch(SERVER_URL + '/api/add', { method: 'POST', headers, body: JSON.stringify(data) });
                const ans = await res.json();
                if (ans.status === 'ok') {
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    showToast('Готово!'); tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (e) { showToast('Нет связи'); }
        }

        function switchTab(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'view-history') loadHistory();
        }

        function downloadExcel() { tg.sendData(JSON.stringify({action: 'download_excel'})); }

        function toggleTheme() {
            const cur = document.body.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('theme-btn').innerText = next === 'dark' ? '☀️' : '🌙';
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        if(tg.colorScheme === 'dark') toggleTheme();
    </script>
</body>
</html>
