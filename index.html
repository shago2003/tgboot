<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #f2f2f7; --card: #fff; --text: #000; --blue: #007aff; --red: #ff3b30; --gray: #8e8e93; }
        [data-theme="dark"] { --bg: #000; --card: #1c1c1e; --text: #fff; }
        
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 16px; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        
        /* Баланс */
        .balance-card {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white; padding: 20px; border-radius: 16px; text-align: center;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3);
        }
        .balance-amount { font-size: 36px; font-weight: 800; margin-top: 5px; }

        /* Элементы */
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--bg); color: var(--text); font-size: 16px; outline: none; margin-top: 5px; box-sizing: border-box; }
        label { font-size: 12px; color: var(--gray); margin-left: 4px; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
        .btn:active { opacity: 0.8; }
        .btn-inc { background: var(--blue); }
        .btn-exp { background: var(--red); }

        /* Меню */
        .tab-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--card); border-top: 0.5px solid var(--gray); 
            display: flex; justify-content: space-around; padding: 10px 0 25px; 
            z-index: 100;
        }
        .tab-item { color: var(--gray); text-align: center; font-size: 10px; cursor: pointer; }
        .tab-item.active { color: var(--blue); }
        .tab-icon { font-size: 24px; display: block; margin-bottom: 2px; }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fade 0.2s; }
        @keyframes fade { from{opacity:0} to{opacity:1} }

        #toast { position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; transition: 0.3s; z-index: 200; }
        #toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="toast">✅ Сохранено</div>

    <div class="balance-card">
        <div style="font-size: 13px; opacity: 0.8">Текущий баланс</div>
        <div class="balance-amount" id="balance">Загрузка...</div>
    </div>

    <div id="view-income" class="view-section active">
        <div class="card">
            <label>Сумма</label><input type="number" id="inc_sum" placeholder="0.00" inputmode="decimal">
            <div style="height:10px"></div>
            <label>Откуда</label><input type="text" id="inc_from" placeholder="Банк">
            <div style="height:10px"></div>
            <label>Куда</label><input type="text" id="inc_to" placeholder="Касса">
        </div>
        <button class="btn btn-inc" onclick="send('income')">Добавить Приход</button>
    </div>

    <div id="view-expense" class="view-section">
        <div class="card">
            <label>Сумма</label><input type="number" id="exp_sum" placeholder="0.00" inputmode="decimal">
            <div style="height:10px"></div>
            <label>Категория</label><input type="text" id="exp_cat" placeholder="Еда">
            <div style="height:10px"></div>
            <label>Комментарий</label><input type="text" id="exp_com" placeholder="Обед">
        </div>
        <button class="btn btn-exp" onclick="send('expense')">Списать Расход</button>
    </div>

    <div id="view-settings" class="view-section">
        <div class="card" onclick="downloadExcel()">
            <div style="color:var(--blue); font-weight:600; font-size:16px">📥 Скачать отчет Excel</div>
        </div>
        <div class="card" onclick="toggleTheme()">
            <div style="font-size:16px">🌓 Сменить тему</div>
            <div style="font-size:12px; color:var(--gray); margin-top:5px" id="theme-status">Авто</div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('view-income')"><span class="tab-icon">➕</span>Приход</div>
        <div class="tab-item" onclick="switchTab('view-expense')"><span class="tab-icon">➖</span>Расход</div>
        <div class="tab-item" onclick="switchTab('view-settings')"><span class="tab-icon">⚙️</span>Опции</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        
        // !!! ВСТАВЬ СВОЮ ССЫЛКУ NGROK НИЖЕ (https://....) !!!
        const SERVER_URL = "https://unsucceeded-idella-violative.ngrok-free.dev";

        // Заголовки для обхода защиты Ngrok
        const headers = { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true' 
        };

        // 1. Загрузка баланса при старте
        fetch(SERVER_URL + '/api/balance', { headers: headers })
            .then(r => r.json())
            .then(d => { 
                document.getElementById('balance').innerText = d.balance + ' ₼'; 
            })
            .catch(e => { 
                document.getElementById('balance').innerText = 'Нет связи'; 
                console.error(e);
            });

        // 2. Отправка данных
        async function send(type) {
            let data = {};
            if (type === 'income') {
                const val = document.getElementById('inc_sum').value;
                if (!val) return alert('Введите сумму');
                data = { debit: val, transfer: document.getElementById('inc_from').value + '-' + document.getElementById('inc_to').value };
            } else {
                const val = document.getElementById('exp_sum').value;
                if (!val) return alert('Введите сумму');
                data = { credit: val, category: document.getElementById('exp_cat').value, comment: document.getElementById('exp_com').value };
            }

            try {
                showToast('⏳ Сохранение...');
                const res = await fetch(SERVER_URL + '/api/add', {
                    method: 'POST', 
                    headers: headers, // <-- Используем те же заголовки
                    body: JSON.stringify(data)
                });
                const ans = await res.json();
                
                if (ans.status === 'ok') {
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    showToast('✅ Готово!'); 
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    alert('Ошибка: ' + ans.message);
                }
            } catch (e) {
                alert('Ошибка соединения. Проверь Ngrok.');
            }
        }

        function switchTab(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function downloadExcel() { tg.sendData(JSON.stringify({action: 'download_excel'})); }
        
        function toggleTheme() {
            const cur = document.body.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('theme-status').innerText = next === 'dark' ? 'Темная' : 'Светлая';
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        document.body.setAttribute('data-theme', tg.colorScheme);
    </script>
</body>
</html>
