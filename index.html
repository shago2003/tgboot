<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f0f2f5; --text: #1d1d1f; --gray: #86868b;
            --card-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --blue-grad: linear-gradient(135deg, #007aff, #00c6ff);
            --red-grad: linear-gradient(135deg, #ff3b30, #ff9f43);
            --green-grad: linear-gradient(135deg, #34c759, #30d158);
        }
        [data-theme="dark"] {
            --bg: #000000; --text: #f5f5f7; --gray: #a1a1a6;
            --card-bg: rgba(28, 28, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 16px; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; transition: background 0.3s; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s; }
        .loader-icon { font-size: 80px; animation: pulse 2s infinite; }
        .error-msg { color: red; margin-top: 20px; font-weight: bold; font-size: 14px; max-width: 80%; text-align: center; display: none; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .spinner { width: 30px; height: 30px; border: 4px solid rgba(0,122,255,0.1); border-left-color: #007aff; border-radius: 50%; margin-top: 20px; animation: spin 1s linear infinite; }

        .glass { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; }
        .card { padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .balance-card { background: var(--blue-grad); color: white; padding: 25px; border-radius: 24px; text-align: center; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3); }
        .balance-amount { font-size: 42px; font-weight: 800; margin-top: 5px; }
        
        input, select { width: 100%; padding: 16px; border-radius: 14px; border: none; background: rgba(128,128,128,0.1); color: var(--text); font-size: 17px; outline: none; margin-top: 8px; box-sizing: border-box; }
        label { font-size: 13px; color: var(--gray); font-weight: 600; margin-left: 8px; }
        
        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-size: 18px; font-weight: 700; color: white; cursor: pointer; margin-top: 20px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-inc { background: var(--blue-grad); box-shadow: 0 5px 15px rgba(0,122,255,0.3); }
        .btn-exp { background: var(--red-grad); box-shadow: 0 5px 15px rgba(255,59,48,0.3); }
        .btn-transfer { background: var(--green-grad); color: white; margin-top: 10px; }

        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px solid var(--glass-border); cursor: pointer; }
        .file-item:last-child { border-bottom: none; }
        .file-name { font-size: 17px; font-weight: 600; }
        .file-check { font-size: 18px; color: #007aff; display: none; }
        .file-item.active .file-check { display: block; }

        .history-item { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .history-bal { font-size: 12px; color: var(--gray); margin-top: 4px; font-weight: 500; }
        .del-btn { background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: none; width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
        /* НОВАЯ КНОПКА КАРАНДАШ */
        .edit-btn { background: rgba(0, 122, 255, 0.1); color: #007aff; border: none; width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 8px; }

        .setting-row { display: flex; align-items: center; padding: 12px; cursor: pointer; }
        .setting-icon { font-size: 24px; margin-right: 15px; }
        .setting-text { font-size: 17px; font-weight: 600; flex: 1; }
        .setting-status { font-size: 15px; color: var(--gray); font-weight: 500; }

        .suggestions-box { position: absolute; width: calc(100% - 40px); background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 14px; max-height: 250px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; margin-top: 5px; }
        .suggestion-item { padding: 12px 16px; border-bottom: 1px solid rgba(128,128,128,0.1); cursor: pointer; font-size: 16px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); backdrop-filter: blur(30px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 12px 0 30px; z-index: 100; border-radius: 25px 25px 0 0; }
        .tab-item { color: var(--gray); text-align: center; font-size: 10px; width: 25%; font-weight: 600; }
        .tab-item.active { color: #007aff; }
        .tab-icon { font-size: 26px; display: block; margin-bottom: 4px; }

        .view-section { display: none; animation: fadeUp 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeUp { from{opacity:0; transform: translateY(15px);} to{opacity:1; transform: translateY(0);} }
        #toast { position: fixed; top: -80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); color: white; padding: 14px 28px; border-radius: 50px; z-index: 200; font-weight: 700; transition: 0.4s; }
        #toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-icon">🏪</div>
        <div style="margin-top:10px;font-weight:700">Загрузка...</div>
        <div class="spinner"></div>
        <div id="error-msg" class="error-msg"></div>
        <button id="retry-btn" class="btn" style="width:auto; padding:10px 20px; margin-top:15px; display:none" onclick="location.reload()">Обновить</button>
    </div>

    <div id="toast">Готово</div>

    <div class="balance-card glass">
        <div style="font-size: 14px; opacity: 0.9;">Касса: <span id="active-file-name" style="font-weight:800">...</span></div>
        <div class="balance-amount" id="balance">...</div>
    </div>

    <div id="view-income" class="view-section active">
        <div class="card glass">
            <label>Сумма</label><input type="number" id="inc_sum" placeholder="0.00">
            <div style="height:15px"></div>
            <label>Источник</label><input type="text" id="inc_from" placeholder="Напр: Зарплата">
            <div style="height:15px"></div>
            <label>Куда</label><input type="text" id="inc_to" placeholder="Напр: Карта">
        </div>
        <button class="btn btn-inc" onclick="send('income')">Внести в кассу</button>
    </div>

    <div id="view-expense" class="view-section">
        <div class="card glass">
            <label>Сумма</label><input type="number" id="exp_sum" placeholder="0.00">
            <div style="height:15px"></div>
            <label>Категория</label>
            <input type="text" id="exp_cat" placeholder="Начните вводить..." autocomplete="off" oninput="filterCategories()" onfocus="filterCategories()">
            <div id="cat-suggestions" class="suggestions-box"></div>
            <div style="height:15px"></div>
            <label>Комментарий</label><input type="text" id="exp_com" placeholder="Детали">
        </div>
        <button class="btn btn-exp" onclick="send('expense')">Списать из кассы</button>
    </div>

    <div id="view-history" class="view-section">
        <div id="history-list" style="padding-bottom:20px"></div>
    </div>

    <div id="view-settings" class="view-section">
        <div style="margin: 0 0 10px 10px; font-weight: 800; font-size: 20px;">🏪 Мои Кассы</div>
        <div class="card glass">
            <div id="files-list">Загрузка...</div>
            <div style="margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
                <input type="text" id="new-file-name" placeholder="Название новой кассы...">
                <button class="btn" style="background:var(--text); color:var(--bg); margin-top:10px; padding:12px" onclick="createFile()">➕ Добавить кассу</button>
            </div>
            <button class="btn btn-transfer" onclick="toggleTransferMode()">💸 Переместить деньги</button>
        </div>
        
        <div id="transfer-block" class="card glass" style="display:none; border: 2px solid #34c759;">
            <div style="font-weight:700; margin-bottom:10px; color:#34c759">Перевод между кассами</div>
            <label>Откуда списать:</label>
            <select id="transfer-source" style="padding:16px; width:100%; border-radius:14px; border:none; background:rgba(128,128,128,0.1); margin-top:5px"></select>
            <div style="height:10px"></div>
            <label>Куда зачислить:</label>
            <select id="transfer-target" style="padding:16px; width:100%; border-radius:14px; border:none; background:rgba(128,128,128,0.1); margin-top:5px"></select>
            <div style="height:10px"></div>
            <label>Сумма:</label>
            <input type="number" id="transfer-amount" placeholder="0.00">
            <button class="btn btn-inc" onclick="doTransfer()" style="background:#34c759; margin-top:15px">Подтвердить перевод</button>
        </div>

        <div style="margin: 20px 0 10px 10px; font-weight: 800; font-size: 20px;">Опции</div>
        <div class="card glass setting-row" onclick="downloadExcel()">
            <span class="setting-icon">📊</span><span class="setting-text">Скачать Excel</span><span class="setting-status">XLSX</span>
        </div>
        <div class="card glass setting-row" onclick="toggleTheme()">
            <span class="setting-icon">🎨</span><span class="setting-text">Тема</span><span class="setting-status" id="theme-status">Авто</span>
        </div>
        <div class="card glass setting-row" onclick="toggleAnim()">
            <span class="setting-icon">✨</span><span class="setting-text">Анимация</span><span class="setting-status" id="anim-status">Вкл</span>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('view-income')"><span class="tab-icon">➕</span>Доход</div>
        <div class="tab-item" onclick="switchTab('view-expense')"><span class="tab-icon">➖</span>Расход</div>
        <div class="tab-item" onclick="switchTab('view-history')"><span class="tab-icon">📝</span>История</div>
        <div class="tab-item" onclick="switchTab('view-settings')"><span class="tab-icon">⚙️</span>Кассы</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        
        // !!! ВСТАВЬ ССЫЛКУ NGROK !!!
        const SERVER_URL = "https://unsucceeded-idella-violative.ngrok-free.dev";
        const headers = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };

        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader.style.display !== 'none') {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                err.innerHTML = `⚠️ Ошибка связи!<br>Не могу подключиться к: <br><small>${SERVER_URL}</small><br><br>Проверь Ngrok и обнови ссылку на GitHub.`;
                document.getElementById('retry-btn').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
            }
        }, 5000);

        const CATEGORIES = [
            "ЕДА", "ПЕРЕВОЗКА", "УТЕРЯ", "МЕБЕЛЬ", "ОХРАНА", "АРЕНДА СКЛАДА", "АРЕНДА ГУЛЬДЕН",
            "БЕНЗИН", "Карго", "РАБОЧИЕ", "КАНЦЕЛЯРИЯ", "ИНТЕРНЕТ", "ПОТЕНТ", "АРЕНДА КВАРТИРА",
            "АВИА БИЛЕТЫ", "ОТЕЛЬ", "КОМАНДИРОВКА", "НАУМ", "ШАМИЛЬ", "МУРАД", "САДУЛЛА", "1С",
            "ТЕХ РАБОТА", "Списание на подарок", "Отдали Нариману", "Переупаковка", "Процент за перевод",
            "Обмен долларов в рубли", "Мойка", "Обмен рублей в доллары", "Такси", "парковка",
            "Сим карты", "Электроника", "Прочее", "Газель", "Лифт на складе", "нехватка",
            "Авто ремонт", "КУРЬЕР", "программист", "САМИРА ЗП", "ПАТЕНТ", "Списание с долга родителей",
            "Налог за ИП", "ВОДИТЕЛЬ ЗАРПЛАТА", "НАЗИМ", "Покупка автомобиля", "строй материалы",
            "ЭРИК", "Расходы Кусары Офис", "Чингиз карго"
        ];

        function filterCategories() {
            const input = document.getElementById('exp_cat');
            const box = document.getElementById('cat-suggestions');
            const val = input.value.toLowerCase();
            box.innerHTML = '';
            const filtered = CATEGORIES.filter(c => c.toLowerCase().includes(val));
            if (filtered.length > 0) {
                box.style.display = 'block';
                filtered.forEach(cat => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item'; div.innerText = cat;
                    div.onclick = () => { input.value = cat; box.style.display = 'none'; };
                    box.appendChild(div);
                });
            } else { box.style.display = 'none'; }
        }
        document.addEventListener('click', function(e) { if (e.target.id !== 'exp_cat') document.getElementById('cat-suggestions').style.display = 'none'; });

        checkAnim();
        function checkAnim() {
            const isEnabled = localStorage.getItem('anim') !== 'off';
            document.getElementById('anim-status').innerText = isEnabled ? 'Вкл' : 'Выкл';
        }
        function toggleAnim() {
            const next = localStorage.getItem('anim') === 'off' ? 'on' : 'off';
            localStorage.setItem('anim', next);
            checkAnim();
        }

        loadBalance();

        async function loadFiles() {
            try {
                const res = await fetch(SERVER_URL + '/api/files', {headers});
                const data = await res.json();
                const list = document.getElementById('files-list');
                const fromSelect = document.getElementById('transfer-source');
                const toSelect = document.getElementById('transfer-target');
                
                list.innerHTML = ''; 
                fromSelect.innerHTML = ''; toSelect.innerHTML = '';
                document.getElementById('active-file-name').innerText = data.active;
                
                data.files.forEach(f => {
                    const isActive = f === data.active;
                    list.innerHTML += `
                        <div class="file-item ${isActive ? 'active' : ''}">
                            <div onclick="setFile('${f}')" style="flex:1; display:flex; align-items:center">
                                <span class="file-name">${f}</span>
                                ${isActive ? '<span class="file-check" style="margin-left:10px">✅</span>' : ''}
                            </div>
                            <button class="edit-btn" onclick="renameFile('${f}')">✏️</button>
                            ${f !== 'Главная Касса' ? `<button class="del-btn" onclick="deleteFile('${f}')">✕</button>` : ''}
                        </div>`;
                    
                    const option1 = document.createElement("option"); option1.text = f; option1.value = f;
                    const option2 = document.createElement("option"); option2.text = f; option2.value = f;
                    fromSelect.add(option1); toSelect.add(option2);
                });
                fromSelect.value = data.active;

            } catch (e) { console.error(e); }
        }

        async function setFile(name) {
            if(!confirm(`Переключиться на кассу "${name}"?`)) return;
            await fetch(SERVER_URL + '/api/files/set', {method:'POST', headers, body:JSON.stringify({name})});
            loadBalance(); loadFiles(); loadHistory(); showToast(`Касса: ${name}`);
        }
        async function createFile() {
            const name = document.getElementById('new-file-name').value;
            if(!name) return showToast('Введите название');
            await fetch(SERVER_URL + '/api/files/create', {method:'POST', headers, body:JSON.stringify({name})});
            document.getElementById('new-file-name').value = '';
            loadBalance(); loadFiles(); loadHistory(); showToast('Касса добавлена!');
        }
        async function deleteFile(name) {
            if(!confirm(`Удалить кассу "${name}" и ВСЕ её операции?`)) return;
            const res = await fetch(SERVER_URL + '/api/files/delete', {method:'POST', headers, body:JSON.stringify({name})});
            const ans = await res.json();
            if(ans.status === 'ok') { loadBalance(); loadFiles(); loadHistory(); showToast('Касса удалена'); } else { showToast(ans.message); }
        }
        
        // НОВОЕ: Переименование
        async function renameFile(oldName) {
            const newName = prompt("Введите новое название:", oldName);
            if (!newName || newName === oldName) return;
            
            const res = await fetch(SERVER_URL + '/api/files/rename', {
                method: 'POST', headers, 
                body: JSON.stringify({ old_name: oldName, new_name: newName }) 
            });
            const ans = await res.json();
            if (ans.status === 'ok') {
                loadBalance(); loadFiles(); loadHistory(); showToast('Переименовано!');
            } else {
                showToast(ans.message);
            }
        }

        function toggleTransferMode() { const block = document.getElementById('transfer-block'); block.style.display = block.style.display === 'none' ? 'block' : 'none'; }
        
        async function doTransfer() {
            const fromK = document.getElementById('transfer-source').value;
            const toK = document.getElementById('transfer-target').value;
            const amount = document.getElementById('transfer-amount').value;
            
            if (fromK === toK) return showToast("Кассы совпадают!");
            if (!amount) return showToast("Введите сумму");
            if(!confirm(`Перевести ${amount} ₼\nИЗ: ${fromK}\nВ: ${toK}?`)) return;
            
            const res = await fetch(SERVER_URL + '/api/transfer', { 
                method: 'POST', headers, 
                body: JSON.stringify({ from_kassa: fromK, to_kassa: toK, amount: amount }) 
            });
            const ans = await res.json();
            if(ans.status === 'ok') { 
                document.getElementById('balance').innerText = ans.new_balance + ' ₼'; 
                document.getElementById('transfer-amount').value = ''; 
                document.getElementById('transfer-block').style.display = 'none'; 
                showToast("Успешно переведено!"); 
            } else { showToast(ans.message || "Ошибка перевода"); }
        }

        function loadBalance() {
            fetch(SERVER_URL + '/api/balance', {headers})
            .then(r=>r.json())
            .then(d=>{
                document.getElementById('balance').innerText = d.balance + ' ₼';
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(()=>loader.style.display='none', 500);
            })
            .catch(e => { console.log("Ошибка баланса"); });
            loadFiles();
        }

        async function send(type) {
            let data = {};
            tg.HapticFeedback.selectionChanged();
            if (type === 'income') {
                const val = document.getElementById('inc_sum').value;
                if (!val) return showToast('Сумма?');
                data = { debit: val, transfer: document.getElementById('inc_from').value + '-' + document.getElementById('inc_to').value };
            } else {
                const val = document.getElementById('exp_sum').value;
                if (!val) return showToast('Сумма?');
                data = { credit: val, category: document.getElementById('exp_cat').value, comment: document.getElementById('exp_com').value };
            }
            try {
                const res = await fetch(SERVER_URL + '/api/add', { method: 'POST', headers, body: JSON.stringify(data) });
                const ans = await res.json();
                if (ans.status === 'ok') {
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    showToast('Успешно'); tg.HapticFeedback.notificationOccurred('success');
                }
            } catch(e) { showToast('Ошибка связи'); }
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            try {
                const res = await fetch(SERVER_URL + '/api/history', {headers});
                const data = await res.json();
                list.innerHTML = '';
                if(!data.length) list.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.5">Пусто</div>';
                data.forEach(item => {
                    const isInc = item.debit > 0;
                    const color = isInc ? '#34c759' : '#ff3b30';
                    const sign = isInc ? '+' : '-';
                    const val = isInc ? item.debit : item.credit;
                    const desc = isInc ? item.transfer : `${item.category} (${item.comment})`;
                    list.innerHTML += `<div class="card glass history-item"><div><div style="font-weight:800; font-size:17px; color:${color}">${sign} ${val} ₼</div><div style="font-size:13px; opacity:0.7; margin-top:4px; font-weight:600">${desc}</div><div class="history-bal">Остаток: ${item.balance} ₼</div></div><button class="del-btn" onclick="delItem(${item.id})">🗑</button></div>`;
                });
            } catch(e){}
        }

        async function delItem(id) {
            if(!confirm("Удалить?")) return;
            await fetch(SERVER_URL + '/api/delete', { method:'POST', headers, body:JSON.stringify({id}) });
            loadBalance(); loadHistory();
        }

        function switchTab(id) {
            tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            const tabs = ['view-income', 'view-expense', 'view-history', 'view-settings'];
            document.querySelectorAll('.tab-item')[tabs.indexOf(id)].classList.add('active');
            if(id === 'view-history') loadHistory();
            if(id === 'view-settings') loadFiles();
        }

        function downloadExcel() { tg.sendData(JSON.stringify({action: 'download_excel'})); }
        function toggleTheme() {
            const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('theme-status').innerText = next === 'dark' ? 'Темная' : 'Светлая';
        }
        function showToast(txt) {
            const t = document.getElementById('toast'); t.innerText = txt; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        if(tg.colorScheme === 'dark') toggleTheme();
    </script>
</body>
</html>
