<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #f2f2f7; --card: #ffffff; --text: #000000; --blue: #007aff; --red: #ff3b30; --gray: #8e8e93; }
        [data-theme="dark"] { --bg: #000000; --card: #1c1c1e; --text: #ffffff; }
        
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 16px; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; transition: background 0.3s; }
        
        /* === ЗАСТАВКА (PRELOADER) === */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center;
            transition: opacity 0.5s ease-out;
        }
        .loader-icon { font-size: 80px; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .loader-title { font-size: 28px; font-weight: 800; color: var(--blue); opacity: 0; animation: fadeInUp 0.8s forwards 0.2s; }
        .loader-sub { font-size: 15px; color: var(--gray); margin-top: 10px; margin-bottom: 40px; opacity: 0; animation: fadeInUp 0.8s forwards 0.5s; }
        .spinner { width: 30px; height: 30px; border: 4px solid rgba(0,122,255,0.1); border-left-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; opacity: 0; animation: spin 1s linear infinite, fadeIn 1s forwards 0.8s; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* ШАПКА */
        .app-header { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .app-title { font-size: 20px; font-weight: 700; color: var(--gray); }

        /* БАЛАНС */
        .balance-card { background: linear-gradient(135deg, #007aff, #0056b3); color: white; padding: 25px 20px; border-radius: 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,122,255,0.25); }
        .balance-label { font-size: 13px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 40px; font-weight: 800; margin-top: 8px; }

        /* ЭЛЕМЕНТЫ */
        .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .card:active { transform: scale(0.99); }
        .card-col { display: block; width: 100%; }
        
        input { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--bg); color: var(--text); font-size: 17px; outline: none; margin-top: 6px; box-sizing: border-box; }
        label { font-size: 13px; color: var(--gray); margin-left: 4px; font-weight: 500; }
        
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 17px; font-weight: 700; color: white; cursor: pointer; margin-top: 15px; }
        .btn-inc { background: var(--blue); box-shadow: 0 4px 12px rgba(0,122,255,0.3); }
        .btn-exp { background: var(--red); box-shadow: 0 4px 12px rgba(255,59,48,0.3); }

        /* НАСТРОЙКИ И ИСТОРИЯ */
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 15px; margin-left: 5px; }
        
        .setting-row { display: flex; align-items: center; width: 100%; padding: 5px 0; }
        .setting-icon { font-size: 24px; margin-right: 15px; width: 30px; text-align: center; }
        .setting-text { font-size: 17px; font-weight: 500; flex-grow: 1; }
        .setting-status { font-size: 15px; color: var(--gray); }

        .history-item { background: var(--card); padding: 14px 18px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .h-val { font-weight: 700; font-size: 16px; }
        .h-desc { font-size: 13px; opacity: 0.6; margin-top: 3px; }
        .del-btn { background: rgba(255, 59, 48, 0.1); color: var(--red); border: none; font-size: 18px; cursor: pointer; padding: 10px; border-radius: 10px; }

        /* МЕНЮ */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 0.5px solid rgba(128,128,128,0.2); display: flex; justify-content: space-around; padding: 12px 0 30px; z-index: 100; backdrop-filter: blur(20px); }
        .tab-item { color: var(--gray); text-align: center; font-size: 10px; cursor: pointer; transition: 0.2s; width: 25%; }
        .tab-item.active { color: var(--blue); transform: translateY(-2px); }
        .tab-icon { font-size: 26px; display: block; margin-bottom: 3px; }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fade 0.2s; }
        @keyframes fade { from{opacity:0; transform: translateY(10px);} to{opacity:1; transform: translateY(0);} }
        
        #toast { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: rgba(30,30,30,0.9); color: white; padding: 12px 24px; border-radius: 30px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 200; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-icon">💰</div>
        <div class="loader-title">Добро пожаловать</div>
        <div class="loader-sub">Загрузка ваших финансов...</div>
        <div class="spinner"></div>
    </div>

    <div id="toast">✅ Готово</div>

    <div class="balance-card">
        <div class="balance-label">Текущий баланс</div>
        <div class="balance-amount" id="balance">...</div>
    </div>

    <div id="view-income" class="view-section active">
        <div class="section-title">Внести доход</div>
        <div class="card card-col">
            <label>Сумма</label><input type="number" id="inc_sum" placeholder="0.00" inputmode="decimal">
            <div style="height:15px"></div>
            <label>Откуда</label><input type="text" id="inc_from" placeholder="Напр: Зарплата">
            <div style="height:15px"></div>
            <label>Куда</label><input type="text" id="inc_to" placeholder="Напр: Карта">
        </div>
        <button class="btn btn-inc" onclick="send('income')">Добавить Приход</button>
    </div>

    <div id="view-expense" class="view-section">
        <div class="section-title">Внести расход</div>
        <div class="card card-col">
            <label>Сумма</label><input type="number" id="exp_sum" placeholder="0.00" inputmode="decimal">
            <div style="height:15px"></div>
            <label>Категория</label><input type="text" id="exp_cat" placeholder="Напр: Продукты">
            <div style="height:15px"></div>
            <label>Комментарий</label><input type="text" id="exp_com" placeholder="Напр: Супермаркет">
        </div>
        <button class="btn btn-exp" onclick="send('expense')">Списать Расход</button>
    </div>

    <div id="view-history" class="view-section">
        <div class="section-title">История операций</div>
        <div id="history-list">
            <div style="text-align:center; padding:40px; color:gray; font-size:14px">Загрузка списка...</div>
        </div>
    </div>

    <div id="view-settings" class="view-section">
        <div class="section-title">Настройки</div>
        
        <div class="card" onclick="toggleTheme()">
            <div class="setting-row">
                <span class="setting-icon">🌓</span>
                <span class="setting-text">Тема оформления</span>
                <span class="setting-status" id="theme-status">Авто</span>
            </div>
        </div>

        <div class="card" onclick="toggleAnim()">
            <div class="setting-row">
                <span class="setting-icon">✨</span>
                <span class="setting-text">Анимация при входе</span>
                <span class="setting-status" id="anim-status">Вкл</span>
            </div>
        </div>

        <div class="card" onclick="downloadExcel()">
            <div class="setting-row">
                <span class="setting-icon">📥</span>
                <span class="setting-text">Скачать отчет (Excel)</span>
                <span class="setting-status">XLSX</span>
            </div>
        </div>

        <div style="text-align:center; margin-top:30px; color:var(--gray); font-size:12px; opacity:0.5">
            Версия 2.0
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('view-income')">
            <span class="tab-icon">➕</span>Приход
        </div>
        <div class="tab-item" onclick="switchTab('view-expense')">
            <span class="tab-icon">➖</span>Расход
        </div>
        <div class="tab-item" onclick="switchTab('view-history')">
            <span class="tab-icon">📝</span>История
        </div>
        <div class="tab-item" onclick="switchTab('view-settings')">
            <span class="tab-icon">⚙️</span>Настройки
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        
        // !!! ВСТАВЬ ССЫЛКУ NGROK НИЖЕ !!!
        const SERVER_URL = "https://unsucceeded-idella-violative.ngrok-free.dev";
        const headers = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };

        // === АНИМАЦИЯ ===
        checkAnim();
        function checkAnim() {
            const isEnabled = localStorage.getItem('anim') !== 'off';
            const loader = document.getElementById('loader');
            document.getElementById('anim-status').innerText = isEnabled ? 'Вкл' : 'Выкл';

            if (isEnabled) {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 2500);
            } else {
                loader.style.display = 'none';
            }
        }
        function toggleAnim() {
            const current = localStorage.getItem('anim') !== 'off';
            const next = !current;
            localStorage.setItem('anim', next ? 'on' : 'off');
            document.getElementById('anim-status').innerText = next ? 'Вкл' : 'Выкл';
            showToast(next ? 'Анимация включена' : 'Анимация выключена');
        }

        // === БАЛАНС И ДАННЫЕ ===
        loadBalance();

        function loadBalance() {
            fetch(SERVER_URL + '/api/balance', {headers}).then(r=>r.json()).then(d=>{
                document.getElementById('balance').innerText = d.balance + ' ₼';
            }).catch(e => document.getElementById('balance').innerText = 'Нет связи');
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            try {
                const res = await fetch(SERVER_URL + '/api/history', {headers});
                const data = await res.json();
                list.innerHTML = '';
                if(!data.length) list.innerHTML = '<div style="text-align:center;padding:40px;color:gray">История пуста</div>';
                
                data.forEach(item => {
                    const isInc = item.debit > 0;
                    const color = isInc ? '#34c759' : '#ff3b30';
                    const sign = isInc ? '+' : '-';
                    const val = isInc ? item.debit : item.credit;
                    const desc = isInc ? item.transfer : `${item.category} (${item.comment})`;
                    
                    list.innerHTML += `
                        <div class="history-item">
                            <div class="h-left">
                                <span class="h-val" style="color:${color}">${sign} ${val} ₼</span>
                                <span class="h-desc">${desc}</span>
                                <span style="font-size:11px; opacity:0.4">${item.date}</span>
                            </div>
                            <button class="del-btn" onclick="delItem(${item.id})">🗑</button>
                        </div>
                    `;
                });
            } catch(e) { list.innerHTML = '<div style="text-align:center;padding:20px;color:red">Ошибка загрузки</div>'; }
        }

        async function delItem(id) {
            if(!confirm("Удалить эту запись?")) return;
            try {
                const res = await fetch(SERVER_URL + '/api/delete', { method:'POST', headers, body:JSON.stringify({id}) });
                const ans = await res.json();
                if(ans.status === 'deleted') {
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    loadHistory();
                    showToast("Удалено");
                }
            } catch(e) { showToast("Ошибка"); }
        }

        async function send(type) {
            let data = {};
            if (type === 'income') {
                const val = document.getElementById('inc_sum').value;
                if (!val) return alert('Введите сумму');
                data = { debit: val, transfer: document.getElementById('inc_from').value + '-' + document.getElementById('inc_to').value };
            } else {
                const val = document.getElementById('exp_sum').value;
                if (!val) return alert('Введите сумму');
                data = { credit: val, category: document.getElementById('exp_cat').value, comment: document.getElementById('exp_com').value };
            }
            try {
                showToast('⏳ Сохранение...');
                const res = await fetch(SERVER_URL + '/api/add', { method: 'POST', headers, body: JSON.stringify(data) });
                const ans = await res.json();
                if (ans.status === 'ok') {
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    showToast('✅ Успешно!'); 
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (e) { showToast('Ошибка связи'); }
        }

        // === НАВИГАЦИЯ И УТИЛИТЫ ===
        function switchTab(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            // Находим кнопку, на которую нажали, и делаем активной
            const tabs = ['view-income', 'view-expense', 'view-history', 'view-settings'];
            const index = tabs.indexOf(id);
            document.querySelectorAll('.tab-item')[index].classList.add('active');
            
            if(id === 'view-history') loadHistory();
        }

        function downloadExcel() { tg.sendData(JSON.stringify({action: 'download_excel'})); }

        function toggleTheme() {
            const cur = document.body.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('theme-status').innerText = next === 'dark' ? 'Темная' : 'Светлая';
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // Старт: тема по умолчанию из Телеграма
        if(tg.colorScheme === 'dark') toggleTheme();
    </script>
</body>
</html>
