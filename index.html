<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #f2f2f7; --card: #fff; --text: #000; --blue: #007aff; --red: #ff3b30; }
        [data-theme="dark"] { --bg: #000; --card: #1c1c1e; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 16px; }
        
        /* Блок Баланса */
        .balance-card {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white; padding: 20px; border-radius: 16px; text-align: center;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3);
        }
        .balance-title { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
        .balance-amount { font-size: 36px; font-weight: 800; }

        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--bg); color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; margin-top: 5px;}
        label { font-size: 12px; opacity: 0.6; margin-left: 4px; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
        .btn-inc { background: var(--blue); }
        .btn-exp { background: var(--red); }
        
        .tab-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: var(--card); border-radius: 10px; opacity: 0.5; font-weight: 600; cursor: pointer; }
        .tab.active { opacity: 1; border: 2px solid var(--blue); }
        
        #toast { position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; transition: 0.3s; z-index: 99; }
        #toast.show { top: 20px; }
    </style>
</head>
<body>

    <div id="toast">✅ Сохранено</div>

    <div class="balance-card">
        <div class="balance-title">Текущий баланс</div>
        <div class="balance-amount" id="balance">...</div>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="setMode('income')" id="tab-inc">Приход</div>
        <div class="tab" onclick="setMode('expense')" id="tab-exp">Расход</div>
    </div>

    <div id="form-income">
        <div class="card">
            <label>Сумма</label><input type="number" id="inc_sum" placeholder="0.00">
            <div style="height:10px"></div>
            <label>Откуда</label><input type="text" id="inc_from" placeholder="Банк">
            <div style="height:10px"></div>
            <label>Куда</label><input type="text" id="inc_to" placeholder="Касса">
        </div>
        <button class="btn btn-inc" onclick="send('income')">Добавить Приход</button>
    </div>

    <div id="form-expense" style="display:none">
        <div class="card">
            <label>Сумма</label><input type="number" id="exp_sum" placeholder="0.00">
            <div style="height:10px"></div>
            <label>Категория</label><input type="text" id="exp_cat" placeholder="Еда">
            <div style="height:10px"></div>
            <label>Комментарий</label><input type="text" id="exp_com" placeholder="Обед">
        </div>
        <button class="btn btn-exp" onclick="send('expense')">Списать Расход</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        // ВСТАВЬ СВОЮ ССЫЛКУ NGROK НИЖЕ
        const SERVER_URL = "https://unsucceeded-idella-violative.ngrok-free.dev";

        // Загрузка баланса при старте
        fetch(SERVER_URL + '/api/balance')
            .then(r => r.json())
            .then(d => { document.getElementById('balance').innerText = d.balance + ' ₼'; })
            .catch(e => { document.getElementById('balance').innerText = 'Ошибка'; });

        function setMode(mode) {
            document.getElementById('form-income').style.display = mode === 'income' ? 'block' : 'none';
            document.getElementById('form-expense').style.display = mode === 'expense' ? 'block' : 'none';
            document.getElementById('tab-inc').className = mode === 'income' ? 'tab active' : 'tab';
            document.getElementById('tab-exp').className = mode === 'expense' ? 'tab active' : 'tab';
            // Цвет вкладки для расхода меняем на красный
            if(mode==='expense') document.getElementById('tab-exp').style.borderColor = '#ff3b30';
        }

        async function send(type) {
            let data = {};
            if (type === 'income') {
                const val = document.getElementById('inc_sum').value;
                if (!val) return alert('Введите сумму');
                data = { debit: val, transfer: document.getElementById('inc_from').value + '-' + document.getElementById('inc_to').value };
            } else {
                const val = document.getElementById('exp_sum').value;
                if (!val) return alert('Введите сумму');
                data = { credit: val, category: document.getElementById('exp_cat').value, comment: document.getElementById('exp_com').value };
            }

            try {
                showToast('⏳ Отправка...');
                const res = await fetch(SERVER_URL + '/api/add', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const ans = await res.json();
                
                if (ans.status === 'ok') {
                    // ОБНОВЛЯЕМ БАЛАНС ТУТ ЖЕ
                    document.getElementById('balance').innerText = ans.new_balance + ' ₼';
                    
                    // Очистка полей
                    document.querySelectorAll('input').forEach(i => i.value = '');
                    showToast('✅ Баланс обновлен!');
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    alert('Ошибка сервера');
                }
            } catch (e) {
                alert('Нет связи с компьютером (проверь Ngrok)');
            }
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
        
        document.body.setAttribute('data-theme', tg.colorScheme);
    </script>
</body>
</html>
